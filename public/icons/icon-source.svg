<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17B4A6" />
      <stop offset="50%" stop-color="#7C5CFC" />
      <stop offset="100%" stop-color="#D81B6B" />
    </linearGradient>
  </defs>
  <!-- Fills the full canvas edge-to-edge: required for maskable icons, the
       OS applies its own shape mask (circle/squircle) on top. -->
  <rect width="512" height="512" fill="#08090D" />
  <!-- Content kept inside the ~80% safe zone (center 410px) so it survives
       any mask shape without clipping the monogram. -->
  <circle cx="256" cy="256" r="176" fill="url(#g)" />
  <text
    x="256"
    y="288"
    font-family="'Space Grotesk', 'Arial', sans-serif"
    font-weight="700"
    font-size="150"
    fill="#ffffff"
    text-anchor="middle"
  >LD</text>
</svg>
