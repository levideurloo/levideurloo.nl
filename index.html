<!doctype html>
<html lang="nl">
  <head>
      <meta charset="UTF-8" />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover"/>
      <meta name="color-scheme" content="dark light" />
      <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFAFE" />
      <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090D" />
      <meta content="telephone=no" name="format-detection" />
      <meta name="MobileOptimized" content="width" />
      <meta name="HandheldFriendly" content="true" />

    <!-- PWA / "Add to Home Screen" -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Levi Deurloo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- rel="manifest" wordt automatisch geïnjecteerd door vite-plugin-pwa tijdens de build -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Levi Deurloo — Web app developer. Portfolio met projecten in Vue, Laravel en API's."
    />
    <title>Levi Deurloo — Web app developer</title>
    <!-- Voorkomt flits van verkeerd thema (light) voor de Vue-app laadt -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ld-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored || (prefersDark ? 'dark' : 'light')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
